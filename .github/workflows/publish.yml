# ==============================================================================
#  ВЫПУСК НА PyPI БЕЗ ЕДИНОГО ТОКЕНА
# ==============================================================================
# Trusted Publishing: PyPI доверяет не секрету, а КОНКРЕТНОМУ workflow в
# конкретном репозитории — проверка идёт по OIDC-удостоверению, которое
# GitHub выдаёт этому запуску и которое живёт минуты.
#
# ЗАЧЕМ ИМЕННО ТАК. Токен PyPI — долгоживущий секрет с правом залить что
# угодно под этим именем. Он утекает вместе с любым дампом окружения, и
# отозвать его успевают не всегда. Здесь отзывать нечего: секрета не
# существует ни в репозитории, ни в настройках, ни на машине автора.
#
# ПУБЛИКАЦИЯ НЕ СЛУЧАЕТСЯ САМА. На боевой PyPI уходит только тег вида
# v0.1.0; всё остальное — ручной запуск, и по умолчанию он метит в
# TestPyPI. Версия на PyPI сгорает навсегда, поэтому случайных путей сюда
# быть не должно.
# ==============================================================================
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Куда публиковать"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  # ---------------------------------------------------------------------------
  # СБОРКА И ПРОВЕРКИ. Отдельным заданием, потому что публикующие задания
  # получают право подписи (id-token) и в них не должно выполняться ничего
  # лишнего — ни сборки, ни тестов, ни чужого кода.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Поставить сборщик
        run: python -m pip install --upgrade build twine pytest

      # ТЕСТЫ ДО СБОРКИ. Версия на PyPI сгорает навсегда: дешевле упасть
      # здесь, чем выпускать 0.1.1 из-за опечатки.
      #
      # ДВА ПРОГОНА, И ЭТО НЕ ИЗЛИШЕСТВО. Библиотека обещает две рабочие
      # конфигурации — голую и `[semantic]`, — и заявляет для них разные
      # числа (R@1 51.6% против 67.0%). Гейт, проверяющий одну, ничего не
      # говорит о второй.
      #
      # Первый прогон здесь однажды и покраснел: шесть тестов опирались на
      # семантику, не объявив этого, и проходили только там, где модель уже
      # стояла. Ровно та ошибка, что описана в RELEASING абзацем про путь к
      # модели на диске автора.
      - name: Тесты, голая установка
        run: python -m pytest tests/ -q

      # Модель тянется из сети при первом обращении. Если не дотянется,
      # is_available() вернёт False и зависящие от неё тесты ПРОПУСТЯТСЯ,
      # а не упадут — сбой сети не выдаёт себя за поломку кода.
      - name: Поставить семантику
        run: python -m pip install ".[semantic]"

      - name: Тесты с моделью
        run: python -m pytest tests/ -q

      - name: Собрать
        run: python -m build

      # twine check ловит то, что ломает страницу проекта: непарсящийся
      # README, кривые метаданные. Страницу нельзя переделать без нового
      # номера версии.
      - name: Проверить метаданные
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # TESTPYPI. Отдельный сервер, имена и версии там не резервируют ничего на
  # боевом. Сюда можно сколько угодно — но версия сгорает и здесь, поэтому
  # для повторов берите суффикс .devN.
  # ---------------------------------------------------------------------------
  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # ЕДИНСТВЕННОЕ право, которое здесь нужно
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # БОЕВОЙ PyPI. Только по тегу v* или явным ручным запуском с target=pypi.
  # ---------------------------------------------------------------------------
  pypi:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
