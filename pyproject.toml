[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-memory"
# Версия живёт в selectivemem/__init__.py и берётся оттуда. Раньше номер
# был записан ДВАЖДЫ, и ничто не сверяло копии: разъехались бы они молча,
# а обнаружилось бы это на чужой отладке, где собранный пакет говорит одно,
# а __version__ внутри него — другое.
dynamic = ["version"]
description = "Memory that writes selectively, forgets with time, and strengthens what proved useful"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "MERUMEZ", email = "selectivemem@gmail.com" }]
keywords = ["memory", "forgetting", "agent", "llm", "spaced-repetition", "npc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NO DEPENDENCIES. The core lives on the standard library and sqlite3.
# That is not asceticism but a requirement: the package has to install
# where the whole machine has 3.7 GB of RAM, and run where there is
# neither torch nor a network.
dependencies = []

[project.optional-dependencies]
# Semantic search. Without it memory matches by shared words and keeps
# working — the degradation is graceful, and it says so in the log.
#
# THE NAME HERE HAS TO MATCH WHAT THE CODE ACTUALLY LOADS. This line used
# to say navec, left over from when the library was Russian-only, while
# embeddings.py had already moved to model2vec as the default. Anyone
# following the instruction printed in our own warning would have
# installed navec, got no semantics, and had nothing to go on.
semantic = ["model2vec>=0.3", "numpy>=1.24"]
# navec is the Russian alternative: 51 MB, word-level, and it needs
# embedding_model_path pointed at the downloaded file. model2vec fetches
# potion-base-8M itself and covers English.
semantic-ru = ["navec>=0.10", "numpy>=1.24"]
dev = ["pytest>=8.0"]

[project.urls]
Source = "https://github.com/MERUMEZ/selective-memory"
Commercial = "https://github.com/MERUMEZ/selective-memory/blob/master/COMMERCIAL.md"

[tool.setuptools.dynamic]
# setuptools достаёт литерал разбором синтаксиса, не импортируя пакет,
# поэтому строка обязана оставаться простым присваиванием.
version = { attr = "selectivemem.__version__" }

[tool.setuptools]
# The package is selectivemem/ and nothing else. Everything else in the
# repository (the bot, the character, the speech stages, the mini app) is
# a DEMONSTRATION of the memory rather than the memory itself, and does
# not travel in the distribution.
packages = ["selectivemem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
